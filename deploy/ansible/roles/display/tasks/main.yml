---
# The unit runs the installed `rustyfarian-bench kiosk`, which older releases lack; a rollback
# below it must fail here, not leave a unit that restarts until systemd gives up.
- name: Check that bench_version has the kiosk
  ansible.builtin.assert:
    that: bench_version[1:] is version(display_kiosk_since, '>=')
    fail_msg: >-
      the display role runs `rustyfarian-bench kiosk`, which needs bench_version
      v{{ display_kiosk_since }} or later, not {{ bench_version }}
    quiet: true

# `| int` would turn a typo into 0, which switches the panel's sleep off without a word
- name: Check that display_sleep_after is whole seconds
  ansible.builtin.assert:
    that: (display_sleep_after | string) is match('^[0-9]+$')
    fail_msg: display_sleep_after is seconds as a whole number, 0 or more, not {{ display_sleep_after }}
    quiet: true

# Pillow comes with the bench's `[kiosk]` extra
- name: Install the kiosk's font
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    install_recommends: false
    name:
      - fonts-dejavu-core   # DejaVu Sans Bold for the kiosk
    state: present

- name: Create the display group
  ansible.builtin.group:
    name: "{{ display_user }}"
    system: true

# the unit grants `video` for /dev/fb*; the group gets the touch panel's event node (udev rule below)
- name: Create the display user
  ansible.builtin.user:
    name: "{{ display_user }}"
    group: "{{ display_user }}"
    system: true
    home: /nonexistent
    create_home: false
    shell: /usr/sbin/nologin

# Its own `[all]` line, so the overlay applies whatever filter section ends the file. The boot
# partition is vfat: no owner or mode here, a chmod there fails.
- name: Enable the panel overlay in config.txt
  ansible.builtin.blockinfile:
    path: /boot/firmware/config.txt
    marker: "# {mark} rustyfarian-bench display"
    block: |
      [all]
      dtoverlay={{ display_dtoverlay }}
  vars:
    display_dtoverlay: >-
      {{ display_overlay }}{{ ',drm' if display_drm else '' }},speed={{ display_spi_hz }},rotate={{ display_rotate }}
  register: display_config

# Reported, not done, as the base role does; the marker keeps later runs reporting it.
- name: Report the reboot the overlay needs
  ansible.builtin.debug:
    msg: a reboot loads the display overlay; reboot once no job runs, then `just pi-check`
  when: display_config is changed

- name: Remember the reboot the overlay needs
  ansible.builtin.file:
    path: /var/run/reboot-required
    state: touch
    owner: root
    group: root
    mode: "0644"
    modification_time: preserve
    access_time: preserve
  when: display_config is changed

# Headless, the panel is framebuffer 0, so the kernel console takes it at boot and blanks it later.
- name: Release the kernel console from the panel
  ansible.builtin.copy:
    src: 90-rustyfarian-bench-display.rules
    dest: /etc/udev/rules.d/90-rustyfarian-bench-display.rules
    owner: root
    group: root
    mode: "0644"
  notify: Reload udev

# The kiosk reads the touch panel to wake from its idle sleep; the restart lets it reopen the node
# under the new owner instead of waiting for its next scan.
- name: Give the touch panel to the display group
  ansible.builtin.template:
    src: 91-rustyfarian-bench-touch.rules.j2
    dest: /etc/udev/rules.d/91-rustyfarian-bench-touch.rules
    owner: root
    group: root
    mode: "0644"
  notify: [Reload udev, Restart the display]

# a `--check` run writes no unit, and systemd cannot start or restart one it has never seen
- name: Look for the display unit
  ansible.builtin.stat:
    path: /etc/systemd/system/rustyfarian-bench-display.service
  register: display_unit_file

# bench_version is in the unit, so a bench upgrade restarts the kiosk from the new install
- name: Install the display unit
  ansible.builtin.template:
    src: rustyfarian-bench-display.service.j2
    dest: /etc/systemd/system/rustyfarian-bench-display.service
    owner: root
    group: root
    mode: "0644"
  register: display_unit
  notify: Restart the display

# before the first reboot the service waits for the panel; it stays active, so this is idempotent
- name: Start the display
  ansible.builtin.systemd_service:
    name: rustyfarian-bench-display
    enabled: true
    state: started
    daemon_reload: "{{ display_unit is changed }}"
  when: display_unit_file.stat.exists or not ansible_check_mode

# --- v1 leftovers, removed once the kiosk has replaced the banner script ---

- name: Switch to the kiosk before the cleanup
  ansible.builtin.meta: flush_handlers

- name: Remove the v1 banner script
  ansible.builtin.file:
    path: /usr/local/bin/rustyfarian-bench-display
    state: absent

# only the package v1 installed; whatever else apt marks unused stays for the admin to judge
- name: Remove the v1 banner's Pillow
  ansible.builtin.apt:
    name: python3-pil
    state: absent
    autoremove: false
    purge: false
