# The `just pi-*` recipes run Ansible from this directory, so the relative paths below hold.
[defaults]
inventory = inventory.yml
roles_path = roles
collections_path = .collections
interpreter_python = auto_silent
callback_result_format = yaml
retry_files_enabled = false
# a handler queued before a failure still runs; otherwise the next run finds the file in place,
# queues nothing, and the sshd or nftables reload never happens
force_handlers = true
# here, not under [ssh_connection], so it also covers the local signing task: its module
# arguments (the CA key) then travel over stdin instead of a file in ~/.ansible/tmp
pipelining = true

[ssh_connection]
# Ansible's defaults, plus: a first-seen host key is recorded, as `just doctor` does; a changed
# one (a reflashed Pi) still fails until `ssh-keygen -R <host>`
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
